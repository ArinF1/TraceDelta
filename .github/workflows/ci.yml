name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, vet, format, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(find . -type f -name '*.go' ! -path './vendor/*' -exec gofmt -l {} + | sort)"
          if [[ -n "${unformatted}" ]]; then
            printf 'The following files require gofmt:\n%s\n' "${unformatted}" >&2
            exit 1
          fi

      - name: Run tests
        run: go test ./...

      - name: Run bounded fuzz smoke
        shell: bash
        run: bash ./scripts/fuzz-smoke.sh

      - name: Run go vet
        run: go vet ./...

      - name: Build CLI
        run: go build ./cmd/tracedelta

      - name: Smoke-test generic CI comparison
        shell: bash
        run: bash ./scripts/ci-compare.smoke.sh ./tracedelta

      - name: Smoke-test Action entry point
        shell: bash
        run: bash ./scripts/run-action.smoke.sh ./tracedelta

      - name: Smoke-test five-target release bundle
        shell: bash
        run: bash ./scripts/build-release.smoke.sh

      - id: local-action-pass
        name: Exercise passing local composite Action
        uses: ./
        with:
          baseline: testdata/baseline.json
          candidate: testdata/baseline.json
          report-directory: tracedelta-action-pass-reports

      - name: Verify passing local Action outputs
        shell: bash
        env:
          TRACEDELTA_EXIT_CODE: ${{ steps.local-action-pass.outputs.exit-code }}
          TRACEDELTA_OUTCOME: ${{ steps.local-action-pass.outputs.outcome }}
          TRACEDELTA_TEXT_REPORT: ${{ steps.local-action-pass.outputs.text-report }}
          TRACEDELTA_JSON_REPORT: ${{ steps.local-action-pass.outputs.json-report }}
          TRACEDELTA_HTML_REPORT: ${{ steps.local-action-pass.outputs.html-report }}
        run: |
          [[ "${TRACEDELTA_EXIT_CODE}" == "0" ]]
          [[ "${TRACEDELTA_OUTCOME}" == "no_differences" ]]
          [[ -s "${TRACEDELTA_TEXT_REPORT}" ]]
          [[ -s "${TRACEDELTA_JSON_REPORT}" ]]
          [[ -s "${TRACEDELTA_HTML_REPORT}" ]]

      - id: local-action
        name: Exercise local composite Action
        uses: ./
        with:
          baseline: testdata/baseline.json
          candidate: testdata/candidate.json
          report-directory: tracedelta-action-reports

      - name: Verify local Action outputs
        shell: bash
        env:
          TRACEDELTA_EXIT_CODE: ${{ steps.local-action.outputs.exit-code }}
          TRACEDELTA_OUTCOME: ${{ steps.local-action.outputs.outcome }}
          TRACEDELTA_TEXT_REPORT: ${{ steps.local-action.outputs.text-report }}
          TRACEDELTA_JSON_REPORT: ${{ steps.local-action.outputs.json-report }}
          TRACEDELTA_HTML_REPORT: ${{ steps.local-action.outputs.html-report }}
        run: |
          [[ "${TRACEDELTA_EXIT_CODE}" == "1" ]]
          [[ "${TRACEDELTA_OUTCOME}" == "differences" ]]
          [[ -s "${TRACEDELTA_TEXT_REPORT}" ]]
          [[ -s "${TRACEDELTA_JSON_REPORT}" ]]
          [[ -s "${TRACEDELTA_HTML_REPORT}" ]]

      - id: local-action-error
        name: Exercise failing local composite Action
        continue-on-error: true
        uses: ./
        with:
          baseline: testdata/baseline.json
          candidate: testdata/does-not-exist.json
          report-directory: tracedelta-action-error-reports

      - name: Verify failing local Action outputs
        if: ${{ always() }}
        shell: bash
        env:
          ACTION_STEP_OUTCOME: ${{ steps.local-action-error.outcome }}
          TRACEDELTA_EXIT_CODE: ${{ steps.local-action-error.outputs.exit-code }}
          TRACEDELTA_OUTCOME: ${{ steps.local-action-error.outputs.outcome }}
        run: |
          [[ "${ACTION_STEP_OUTCOME}" == "failure" ]]
          [[ "${TRACEDELTA_EXIT_CODE}" == "2" ]]
          [[ "${TRACEDELTA_OUTCOME}" == "error" ]]
          [[ ! -e tracedelta-action-error-reports/tracedelta-report.txt ]]
          [[ ! -e tracedelta-action-error-reports/tracedelta-report.json ]]
          [[ ! -e tracedelta-action-error-reports/tracedelta-report.html ]]

  windows-verify:
    name: Windows validation watchdog
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Test process watchdog
        shell: powershell
        run: .\scripts\check.tests.ps1

      - name: Run bounded Windows checks
        shell: powershell
        run: .\scripts\check.ps1
