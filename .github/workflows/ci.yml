name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, vet, format, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(find . -type f -name '*.go' ! -path './vendor/*' -exec gofmt -l {} + | sort)"
          if [[ -n "${unformatted}" ]]; then
            printf 'The following files require gofmt:\n%s\n' "${unformatted}" >&2
            exit 1
          fi

      - name: Run tests
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build CLI
        run: go build ./cmd/tracedelta

  windows-verify:
    name: Windows validation watchdog
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Test process watchdog
        shell: powershell
        run: .\scripts\check.tests.ps1

      - name: Run bounded Windows checks
        shell: powershell
        run: .\scripts\check.ps1
