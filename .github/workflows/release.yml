name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: Version label used only for a non-publishing dry run.
        required: true
        default: v0.1.0-test

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build five release targets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: true

      - name: Build binaries and checksums
        shell: bash
        run: bash ./scripts/build-release.sh "${RELEASE_VERSION}" dist

      - name: Verify release bundle
        shell: bash
        run: |
          cd dist
          sha256sum --check "tracedelta_${RELEASE_VERSION#v}_checksums.txt"
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 6

      - name: Upload dry-run bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tracedelta-${{ env.RELEASE_VERSION }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish GitHub Release
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tracedelta-${{ github.ref_name }}
          path: dist

      - name: Re-verify downloaded checksums
        shell: bash
        run: |
          cd dist
          sha256sum --check "tracedelta_${GITHUB_REF_NAME#v}_checksums.txt"

      - name: Publish immutable tagged release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "TraceDelta ${GITHUB_REF_NAME}" \
            --generate-notes
